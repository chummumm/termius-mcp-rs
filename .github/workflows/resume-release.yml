name: Resume verified release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/release-resume.json

permissions:
  contents: read

concurrency:
  group: release-binaries
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate completed source build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      run_id: ${{ steps.validate.outputs.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified commit
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified commit
        with:
          python-version: "3.13"
      - name: Validate source run, successful builds, and immutable release tag
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_release_resume.py

  publish:
    name: Resume publication of verified packages
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SOURCE_DIR: release-source
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_OUTPUT: dist/release-assets
    steps:
      - name: Check out the reviewed recovery automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified commit
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the original immutable release source separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified commit
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified commit
        with:
          python-version: "3.13"
      - name: Download the previously tested native packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          pattern: release-*
          merge-multiple: true
          path: dist/release-assets
          digest-mismatch: error
      - name: Revalidate original source, archives, licenses, and checksums
        run: python scripts/assemble_release.py
      - name: Resume the verified draft and publish only matching assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
