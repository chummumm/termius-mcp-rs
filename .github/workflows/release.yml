name: Release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version matching Cargo.toml (without v)
        required: true
        default: "0.1.2"
        type: string
  push:
    branches: [main]
    paths:
      - .github/release.json

permissions:
  contents: read

concurrency:
  group: release-binaries
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified commit
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified commit
        with:
          python-version: "3.13"
      - name: Validate version and exact source commit
        id: validate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python scripts/prepare_release.py
      - name: Test release scripts
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_OUTPUT: dist/release-assets
      TERMIUS_KEYRING: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified commit
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified commit
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action, verified commit
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Check formatting, lints, and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Install localhost SSH test server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Test against real OpenSSH
        if: runner.os == 'Linux'
        run: cargo test --test ssh_openssh --locked -- --ignored
      - name: Build both native binaries
        run: cargo build --release --locked --bins
      - name: Smoke-test original commands and MCP
        run: python scripts/release_smoke.py
      - name: Package binaries and actual third-party licenses
        run: python scripts/package_release.py
      - name: Upload platform package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          # A rerun can replace this run's temporary build artifact. Public
          # release assets are verified separately and are never overwritten.
          overwrite: true

  publish:
    name: Verify and publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_OUTPUT: dist/release-assets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified commit
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified commit
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release-assets
          digest-mismatch: error
      - name: Verify all platform packages and produce SHA256SUMS
        run: python scripts/assemble_release.py
      - name: Create tag, upload draft assets, verify downloads, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
