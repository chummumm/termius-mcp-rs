[package]
name = "termius-mcp-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Native Rust MCP server for Termius Cloud, SSH and SFTP"
license = "BSD-3-Clause"
repository = "https://github.com/chummumm/termius-mcp-rs"
readme = "README.md"
keywords = ["mcp", "termius", "ssh", "sftp"]
categories = ["command-line-utilities", "network-programming"]
default-run = "termius"

[lib]
name = "termius_mcp"
path = "src/lib.rs"

[[bin]]
name = "termius"
path = "src/main.rs"

[[bin]]
name = "termius-mcp"
path = "src/bin/termius-mcp.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
aes = "0.8"
base64 = "0.22"
blake2 = "0.10"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
crypto_box = { version = "0.9", features = ["std"] }
crypto_secretbox = { version = "0.1", features = ["std"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
hmac = "0.12"
libc = "0.2"
keyring = { version = "4.2", features = ["v1"] }
num-bigint = "0.4"
pbkdf2 = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rustix = { version = "1", features = ["process"] }
rustyline = { version = "17.0.2", default-features = false }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "warn"
